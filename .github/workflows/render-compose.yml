name: Render Compose Graph
on:
  push:
    paths:
      - docker-compose.yml
      - scripts/service-graph.py
      - .github/workflows/render-compose.yml
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Graphviz
        run: sudo apt-get update -q && sudo apt-get install -y -q graphviz
      - name: Generate graph
        shell: bash # fail the step if any command in the pipeline fails
        run: |
          docker compose --profile '*' config --format json --no-interpolate \
            | scripts/service-graph.py \
            | dot -Tpng -Gdpi=110 -o images/service-graph.png
      - name: Commit and push
        shell: bash
        run: |
          git config user.email "robots@place.technology"
          git config user.name "PlaceOS Robot"
          git add images/service-graph.png
          git commit --message="docs: update service graph for changes in ${{ github.sha }}" || echo "nothing to commit :)"
          git push || echo "nothing to push :)"
