listener 1883
listener 9001
protocol websockets

include_dir /mosquitto
auth_plugin /mosquitto/go-auth.so
auth_opt_backends jwt
auth_opt_jwt_mode remote
auth_opt_jwt_host api
auth_opt_jwt_port 3000
auth_opt_jwt_getuser_uri /api/engine/v2/mqtt/mqtt_user
auth_opt_jwt_aclcheck_uri /api/engine/v2/mqtt/mqtt_access
auth_opt_jwt_response_mode status
auth_opt_jwt_params_mode form

# A client subscribing is sent every retained message under its filter at
# once, and mosquitto drops whatever does not fit its outgoing queue (1000
# messages by default) without telling it. Large sites retain far more than
# that, so a client subscribing widely (stagehand's hot list, source clearing
# or sweeping retained state) saw only part of it. A client that needs more
# can subscribe more narrowly, or refresh.
max_queued_messages 10000
